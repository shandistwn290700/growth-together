# Deploy di VPS (Ubuntu) dengan Docker. Panduan lengkap: docs/DEPLOY.md
# Jalankan dari folder deploy/:  docker compose up -d --build
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: growth_together
      POSTGRES_USER: growth_together
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di deploy/.env}
    volumes:
      # Postgres 18 menyimpan data di subfolder versi di bawah /var/lib/postgresql
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_together -d growth_together"]
      interval: 5s
      retries: 10
    # Sengaja tidak membuka port ke internet: hanya bisa diakses oleh container app.

  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://growth_together:${POSTGRES_PASSWORD}@db:5432/growth_together
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Isi DOMAIN di deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
